[theme]
base = "dark"
primaryColor = "#877ae8"
backgroundColor = "#131313"
secondaryBackgroundColor = "#1e1e1e"
textColor = "#f2f3f5"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# headless is intentionally left unset. Setting it false makes Streamlit try to
# open a browser on the machine it runs on, which is wrong on a deploy host and
# only ever helped locally. `streamlit run` opens a browser locally anyway.
